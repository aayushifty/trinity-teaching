# Trinity Teaching AI server (Cloudflare Worker).
# Setup steps are in server/README.md.
name = "trinity-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "trinity-ai"
# Replace with the id printed by `npx wrangler d1 create trinity-ai`.
database_id = "8c951f33-2c6b-44cd-95a1-beb658aae663"

# Cloudflare Workers AI: free daily allowance, no key. Used when Gemini's free quota is busy.
[ai]
binding = "AI"

[vars]
# Maximum AI requests per day for the whole college (protects the AI bill).
DAILY_LIMIT = "400"
# "1" answers without calling the AI (for testing the app with no key). Never use in production.
DEMO_MODE = "0"
# Free models, tried in this order (src/ai.js):
#   Gemini: GEMINI_MODEL first if set, then gemini-flash-lite-latest / gemini-flash-latest / gemini-2.5-flash
#           (the "-latest" aliases keep working when Google renames a release).
#           GEMINI_MODELS = "a,b,c" replaces the whole Gemini order.
#   Backup: CF_MODEL (Cloudflare Workers AI), then CF_FALLBACK_MODEL for Ask only.
GEMINI_MODEL = ""
CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CF_FALLBACK_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# Security (src/index.js). The access code ships inside the app, so these limits matter:
# Per-address hourly cap on Ask and Quiz (one school network shares an address).
PER_IP_HOURLY = "300"
# Optional network lock. "NP" = Nepal only. ALLOWED_IPS = "a.b.c.,d.e.f.g" = college network only.
# Leave empty to allow everywhere. Check what /health reports as "country" before setting it.
ALLOWED_COUNTRIES = ""
ALLOWED_IPS = ""

# Secrets (set with `npx wrangler secret put NAME`, never written here):
#   GEMINI_API_KEY     free key from https://aistudio.google.com/apikey (optional: without it
#                      only Workers AI is used)
#   ACCESS_CODE        school access code typed once on each board. To rotate it, set "new,old",
#                      publish the app update with the new code, then set just "new" a week later.
#   ADMIN_TOKEN        used by scripts/ingest-papers.mjs to add past papers

# Background answer check for the question bank (src/index.js → verifyBatch): every 5 minutes,
# Gemini only; it stops by itself when every question has been checked.
[triggers]
crons = ["*/5 * * * *"]
